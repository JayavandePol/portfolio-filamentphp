version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jayavandepol-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - storage_data:/var/www/html/storage
      - public_data:/var/www/html/public
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: jayavandepol-nginx
    restart: unless-stopped
    ports:
      - "4002:80"
    volumes:
      - public_data:/var/www/html/public
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    container_name: jayavandepol-postgres
    restart: unless-stopped
    ports:
      - "1000:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-jayavandepol}
      POSTGRES_USER: ${DB_USERNAME:-jayavandepol}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pg-data:
  storage_data:
  public_data: